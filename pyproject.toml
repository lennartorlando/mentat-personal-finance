[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-agent"
version = "0.1.0"
description = "Mentat: local-first personal finance data interaction in Europe."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Leonardo" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/lennartorlando/mentat-personal-finance"
Issues = "https://github.com/lennartorlando/mentat-personal-finance/issues"

[project.scripts]
personal-finance-agent = "personal_finance_agent.cli:main"
pfa = "personal_finance_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
